# ── Reference genome (the one with the GFF annotation) ──────────────────────
reference:
  name: "B73"                              # used as the {genome} wildcard for the reference
  fasta: "/path/to/reference.fa"           # .fa/.fasta, optionally .gz
  gff: "/path/to/reference.gff3"           # GFF3 annotation of the reference, optionally .gz

# ── Targets ─────────────────────────────────────────────────────────────────
targets: "config/targets.tsv"              # sample sheet; see README for column definitions

# ── Output directory ────────────────────────────────────────────────────────
outdir: "results"

# ── minimap2 CDS-mapping parameters ────────────────────────────────────────
# These are AnchorWave's recommended defaults; override only if you know why.
minimap2:
  args: "-x splice -k 12 -a -p 0.4 -N 20"

# ── Pre-alignment CDS dotplot ───────────────────────────────────────────────
# Raise min_mapq to hide multi-copy genes; keep 0 to see duplicated blocks.
cds_dotplot:
  min_mapq: 0

# ── QC report (results/qc/*.html) ───────────────────────────────────────────
# Group targets in the report by one column of the targets sheet; "" for no grouping.
qc_report:
  group_by: ""

# ── AnchorWave gff2seq extra flags ──────────────────────────────────────────
gff2seq:
  extra: ""

# ── AnchorWave genoAli defaults ─────────────────────────────────────────────
genoali:
  inversions: true   # pass -IV to allow inversions
  extra: ""          # extra flags for all genoAli runs

# ── AnchorWave proali defaults ──────────────────────────────────────────────
proali:
  extra: ""          # extra flags for all proali runs

# ── Per-rule resource defaults ──────────────────────────────────────────────
# Override any value here; Slurm account/partition come from your own profile.
# mem_mb is in megabytes; runtime is in minutes.
resources:
  stage_fasta:
    threads: 1
    mem_mb: 4096
    runtime: 120
  stage_gff:
    threads: 1
    mem_mb: 2048
    runtime: 60
  faidx:
    threads: 1
    mem_mb: 2048
    runtime: 60
  gff2seq:
    threads: 1
    mem_mb: 8192
    runtime: 120
  minimap2_cds:
    threads: 8
    mem_mb: 32768
    runtime: 720
  anchorwave_align:
    threads: 16
    mem_mb: 253952       # 248 GB — sized for ~3 Gb genomes (e.g. Capsicum)
    runtime: 8640        # 6 days
  plot_cds_dotplot:
    threads: 1
    mem_mb: 8192
    runtime: 60
  plot_anchors:
    threads: 1
    mem_mb: 8192
    runtime: 60
  summarize_maf:
    threads: 1
    mem_mb: 16384        # holds one byte per reference base, plus whole-chromosome MAF lines
    runtime: 240         # pure-Python pass over multi-Gb MAFs
  aggregate_summary:
    threads: 1
    mem_mb: 2048
    runtime: 20
