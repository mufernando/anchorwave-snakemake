$schema: "https://json-schema.org/draft/2020-12/schema"
description: "AnchorWave pipeline configuration"
type: object
required:
  - reference
  - targets
properties:
  reference:
    type: object
    required: [name, fasta, gff]
    properties:
      name:
        type: string
        pattern: "^[A-Za-z0-9_.\\-]+$"
      fasta:
        type: string
      gff:
        type: string
  targets:
    type: string
  outdir:
    type: string
    default: "results"
  minimap2:
    type: object
    properties:
      args:
        type: string
        default: "-x splice -k 12 -a -p 0.4 -N 20"
  cds_dotplot:
    type: object
    properties:
      min_mapq:
        type: integer
        minimum: 0
        default: 0
  gff2seq:
    type: object
    properties:
      extra:
        type: string
        default: ""
  genoali:
    type: object
    properties:
      inversions:
        type: boolean
        default: true
      extra:
        type: string
        default: ""
  proali:
    type: object
    properties:
      extra:
        type: string
        default: ""
  resources:
    type: object
    additionalProperties:
      type: object
      properties:
        threads:
          type: integer
          minimum: 1
        mem_mb:
          type: integer
          minimum: 1
        runtime:
          type: integer
          minimum: 1
