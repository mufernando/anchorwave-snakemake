$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Target genome sample sheet"
type: object
properties:
  sample:
    type: string
    pattern: "^[A-Za-z0-9_.\\-]+$"
  fasta:
    type: string
  mode:
    type: string
    enum: ["genoAli", "proali"]
    default: "genoAli"
  proali_R:
    type: string
    pattern: "^[1-9][0-9]*$"
  proali_Q:
    type: string
    pattern: "^[1-9][0-9]*$"
  extra:
    type: string
    default: ""
required:
  - sample
  - fasta
